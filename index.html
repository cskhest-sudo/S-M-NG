<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tọa độ khách hàng - Trạm tổng kiểm tra</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6fb8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--bd:#d9e0e7;--pr:#0b6fb8;--prt:#fff;--dg:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111820;--card:#1a232e;--tx:#e8edf2;--mu:#93a1b0;--bd:#2c3846;--pr:#4aa3e6;--prt:#08131d;--dg:#ff7b6b}}
:root[data-theme="dark"]{--bg:#111820;--card:#1a232e;--tx:#e8edf2;--mu:#93a1b0;--bd:#2c3846;--pr:#4aa3e6;--prt:#08131d;--dg:#ff7b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Arial,Helvetica,sans-serif}
header{background:var(--pr);color:var(--prt);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1 1 100%}
header button{padding:6px 10px}
@media (min-width:700px){header h1{flex:1 1 auto}#hd{flex:0 0 auto!important}}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;cursor:pointer}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
button.d{color:var(--dg)}header button{background:transparent;color:var(--prt);border-color:var(--prt)}
input,select{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.mu{color:var(--mu);font-size:13px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.item:first-child{border-top:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;white-space:nowrap}th{background:var(--bg)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(560px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
#msg{font-size:13px;margin:6px 0}.err{color:var(--dg)}.ok{color:#2e8b57}
a{color:var(--pr)}details{margin-top:10px}summary{cursor:pointer;color:var(--pr)}
.pin{width:26px;height:26px;border-radius:50%;background:#0b6fb8;color:#fff;font:bold 12px/22px Arial;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}.pin.bad{background:#c0392b}
.plb{position:absolute;left:30px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.92);color:#000;font:bold 11px Arial;padding:1px 6px;border-radius:4px;border:1px solid #888;white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}.seg{transform:translate(-50%,-50%);background:rgba(255,255,255,.9);color:#000;font:bold 11px Arial;padding:1px 5px;border-radius:4px;border:1px solid #888;white-space:nowrap}
html{overscroll-behavior-y:contain}
header{position:sticky;top:0;z-index:10}
header .sp2{flex:1}
button{touch-action:manipulation;transition:opacity .12s}button:active{opacity:.65}button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
#hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 100%}#hd #sy{margin-right:auto}
#sy{font-size:12px;opacity:.95;white-space:nowrap;cursor:pointer}#sy.off{font-weight:bold}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:50;font-size:14px;max-width:92vw;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast button{background:transparent;color:inherit;border-color:currentColor;padding:4px 10px}
#ptr{position:fixed;top:8px;left:50%;transform:translate(-50%,-150%);opacity:0;transition:transform .15s,opacity .15s;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:13px;z-index:40;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}#ptr{transition:none}}
</style>
</head>
<body>
<header><h1 id="ttl">📍 Tọa độ khách hàng</h1><span id="hd"></span></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" hidden></div><div id="ptr" aria-hidden="true">↓ Kéo để làm mới</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const mem={};
const st={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return mem['s'+k]??null}},set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){mem['s'+k]=v}}};
let user=null,token=null,data={stations:[]},view={name:'stations'},q='',loaded=false,dataVer=0;
const station=()=>data.stations.find(s=>s.id===view.id);

/* ===== KẾT NỐI MÁY CHỦ GOOGLE APPS SCRIPT ===== */
const API='https://script.google.com/macros/s/AKfycbxMSO67JZDoKG4-ZI2xfph1wC7ehj1IdAhRSlJpx4XiO6U68WAS4NUMgMhBl4aNqwu0/exec';
/* Phiên đăng nhập lưu bền (localStorage) để đóng/mở app không phải đăng nhập lại */
user=st.get('ctl:user')||ss.get('user');token=st.get('ctl:token')||ss.get('token');
if(!user||!token){user=null;token=null}
const persist=(u,t)=>{if(u){st.set('ctl:user',u);st.set('ctl:token',t);st.set('ctl:lastuser',u)}else{st.del('ctl:user');st.del('ctl:token');ss.set('user',null);ss.set('token',null)}};
async function api(action,p={},ms=25000){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
  try{
    const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token,...p}),signal:ac.signal});
    const j=await r.json();
    if(j.error==='AUTH'&&action!=='logout'&&user)forceLogout('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại. Dữ liệu chưa đồng bộ vẫn được giữ trên máy.');
    return j;
  }catch(e){return {ok:false,net:true,error:e.name==='AbortError'?'Máy chủ phản hồi quá lâu':'Không kết nối được máy chủ'}}
  finally{clearTimeout(tm)}
}
const localKey=()=>'ctl:data:'+user,dirtyKey=()=>'ctl:dirty:'+user;
const isDirty=()=>!!user&&st.get(dirtyKey())==='1';
const setDirty=v=>{if(user){v?st.set(dirtyKey(),'1'):st.del(dirtyKey())}};
let sstate='',syncing=false,lastSync=0,saveT,pushP=null;
function setStatus(s){sstate=s;paintStatus()}
function paintStatus(){
  const e=$('#sy');if(!e)return;
  const M={sync:'<span class="spin">⟳</span> Đang đồng bộ',ok:'✓ Đã đồng bộ',dirty:'● Chờ đồng bộ',off:'⚠ Mất kết nối'};
  e.innerHTML=M[sstate]||'';e.className=sstate==='off'?'off':'';
}
/* Lưu: ghi ngay vào máy (tức thì), đẩy lên máy chủ sau 0,8 giây */
const save=()=>{dataVer++;setDirty(true);st.set(localKey(),JSON.stringify(data));setStatus('dirty');clearTimeout(saveT);saveT=setTimeout(push,800)};
function push(){return pushP=(pushP||Promise.resolve()).then(doPush)}
async function doPush(){
  if(!user||!isDirty())return true;
  const v=dataVer;setStatus('sync');
  const r=await api('save',{data});
  if(r.ok){if(dataVer===v){setDirty(false);setStatus('ok')}else setStatus('dirty');return true}
  if(r.error!=='AUTH'){
    setStatus(r.net?'off':'dirty');
    const m=$('#msg');if(m){m.className='err';m.textContent='Chưa lưu được lên máy chủ: '+r.error+' (đã lưu tạm trên máy, sẽ tự đồng bộ lại).'}
  }
  return false;
}
/* Đồng bộ nền: đẩy thay đổi chưa gửi, rồi tải bản mới. Không chặn giao diện. */
async function sync(manual){
  if(!user||!token||syncing)return;
  syncing=true;setStatus('sync');
  try{
    if(isDirty()){const ok=await push();if(!ok)return;setStatus('sync')}
    const v=dataVer,r=await api('load');
    if(!user)return;
    if(!r.ok){
      if(r.error!=='AUTH'){setStatus('off');if(manual)toast(r.error)}
      if(!loaded)render();
      return;
    }
    lastSync=Date.now();
    if(v!==dataVer||isDirty()){setStatus(isDirty()?'dirty':'ok');return}
    const nd=r.data&&r.data.stations?r.data:{stations:[]},js=JSON.stringify(nd),was=loaded;
    if(js!==st.get(localKey())){
      if($('#dlg').open){setStatus('ok');return}
      loaded=true;data=nd;dataVer++;st.set(localKey(),js);refresh();
    }else{loaded=true;if(!was)refresh()}
    setStatus('ok');
  }finally{syncing=false}
}
let reg=false;
function toggleReg(e){
  e.preventDefault();reg=!reg;
  $('#lt').textContent=reg?'Tạo tài khoản':'Đăng nhập';
  $('#lb').textContent=reg?'Tạo tài khoản':'Đăng nhập';
  $('#rcw').hidden=!reg;
  $('#tg').textContent=reg?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Tạo mới';
}
let warmed=0;
function warm(){if(Date.now()-warmed<60000)return;warmed=Date.now();fetch(API,{method:'POST',body:JSON.stringify({action:'ping'})}).catch(()=>{})}
async function doLogin(){
  const u=$('#u').value.trim().toLowerCase(),p=$('#p').value,b=$('#lb'),m=$('#msg');
  if(!u||p.length<6){m.className='err';m.textContent='Nhập tên đăng nhập và mật khẩu (tối thiểu 6 ký tự).';return}
  b.disabled=true;m.className='mu';
  const t0=Date.now(),tick=()=>{const n=Math.round((Date.now()-t0)/1000);m.textContent='Đang xử lý… '+n+' giây'+(n>=4?' (máy chủ Google đang khởi động, vui lòng chờ)':'')};tick();const iv=setInterval(tick,1000);
  const r=await api(reg?'register':'login',{username:u,password:p,regCode:reg?$('#rc').value.trim():''},40000);
  clearInterval(iv);b.disabled=false;
  if(!r.ok){m.className='err';m.textContent=r.error;return}
  user=r.username;token=r.token;persist(user,token);
  /* Vào app ngay bằng dữ liệu đã lưu trên máy, tải bản mới ở nền */
  let c=null;try{c=JSON.parse(st.get(localKey())||'null')}catch(e){}
  loaded=!!(c&&c.stations);data=loaded?c:{stations:[]};dataVer++;view={name:'stations'};
  /* Máy chủ trả luôn dữ liệu cùng lúc đăng nhập: dùng ngay, khỏi gọi thêm một lượt tải (trừ khi máy còn thay đổi chưa gửi) */
  if(r.data&&r.data.stations&&!isDirty()){loaded=true;data=r.data;st.set(localKey(),JSON.stringify(data));lastSync=Date.now();render();setStatus('ok');prewarm();return}
  render();sync();
}
async function logout(){
  if(isDirty()){const ok=await push();if(!ok&&!confirm('Còn dữ liệu chưa đồng bộ lên máy chủ. Vẫn đăng xuất? (Dữ liệu vẫn được giữ trên máy và sẽ gửi lên khi bạn đăng nhập lại.)'))return}
  api('logout');forceLogout();
}
function forceLogout(m){
  user=null;token=null;persist(null);data={stations:[]};loaded=false;dataVer++;sstate='';
  const d=$('#dlg');if(d&&d.open)d.close();
  view={name:'stations'};render();
  if(m&&$('#msg')){$('#msg').className='err';$('#msg').textContent=m}
}
async function exportSheet(){
  const m=$('#msg');m.className='mu';m.textContent='Đang xuất lên Google Sheet…';
  await push();
  const r=await api('export',{station:station()},60000);
  if(!r.ok){m.className='err';m.textContent='Lỗi: '+r.error;return}
  m.className='ok';
  m.innerHTML=`Đã xuất ${r.customers} khách hàng, ${r.sections} đoạn. <a target="_blank" rel="noopener" href="${esc(r.url)}">Mở Google Sheet</a>`;
}
/* ===== HẾT PHẦN MÁY CHỦ ===== */

function toast(m,act){
  const t=$('#toast');t.innerHTML=esc(m)+(act?` <button onclick="${act.js}">${act.label}</button>`:'');t.hidden=false;
  clearTimeout(toast.t);if(!act)toast.t=setTimeout(()=>{t.hidden=true},3500);
}
function render(){
  renderHd();
  if(!user)return renderLogin();
  view.name==='station'&&station()?renderStation():renderStations();
}
function renderHd(){
  $('#hd').innerHTML=user?`<span id="sy" onclick="sync(true)"></span><span style="font-size:13px">👤 ${esc(user)}</span><button onclick="sync(true)" title="Làm mới dữ liệu" aria-label="Làm mới dữ liệu">⟳</button><button onclick="logout()">Đăng xuất</button>`:'';
  paintStatus();
}
function refresh(fit){
  if(view.name==='station'&&station()){
    if(stView===view.id&&$('#rows'))updateStation(fit);else renderStation();
  }else{
    if(view.name==='station')view={name:'stations'};
    render();
  }
}
function renderLogin(){
  destroyMap();stView=null;
  $('#ttl').textContent='📍 Tọa độ khách hàng';
  reg=false;
  const enter=`onkeydown="if(event.key==='Enter')doLogin()"`;
  $('#app').innerHTML=`<div class="card" style="max-width:380px;margin:30px auto"><h2 style="margin-top:0" id="lt">Đăng nhập</h2>
  <label>Tên đăng nhập</label><input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" value="${esc(st.get('ctl:lastuser')||'')}" ${enter}><label>Mật khẩu</label><input id="p" type="password" autocomplete="current-password" enterkeyhint="go" ${enter}>
  <div id="rcw" hidden><label>Mã đăng ký (do quản trị cấp)</label><input id="rc" ${enter}></div>
  <div id="msg" class="err"></div><div class="row"><button class="p sp" onclick="doLogin()" id="lb">Đăng nhập</button></div>
  <p class="mu"><a href="#" onclick="toggleReg(event)" id="tg">Chưa có tài khoản? Tạo mới</a></p>
  <p class="mu">Đăng nhập một lần, lần sau mở app là vào thẳng. Dữ liệu lưu trên máy chủ Google theo từng tài khoản.</p></div>`;
  if(!$('#u').value)$('#u').focus();else $('#p').focus();
  warm();
}

function renderStations(){
  destroyMap();stView=null;
  $('#ttl').textContent='📍 Các trạm tổng kiểm tra';
  const l=data.stations.map(s=>`<div class="item"><div><b>${esc(s.name||s.code)}</b> · ${esc(s.code)}<div class="mu">NV quản lý: ${esc(s.manager)} · ${esc(s.place)} · ${s.customers.length} khách hàng</div></div>
  <div class="row"><button class="p" onclick="openStation('${s.id}')">Mở</button><button onclick="stationForm('${s.id}')">Sửa</button><button class="d" onclick="delStation('${s.id}')">Xóa</button></div></div>`).join('');
  const empty=!loaded
    ?(sstate==='off'?'<p class="err">Chưa tải được dữ liệu. Kiểm tra mạng rồi bấm ⟳ ở góc trên hoặc kéo màn hình xuống.</p>':'<p class="mu"><span class="spin">⟳</span> Đang tải dữ liệu từ máy chủ…</p>')
    :'<p class="mu">Chưa có trạm nào. Bấm “Thêm trạm” để bắt đầu.</p>';
  $('#app').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0" class="sp">Danh sách trạm</h2><button class="p" onclick="stationForm()" ${loaded?'':'disabled'}>+ Thêm trạm</button></div>
  ${l||empty}</div><div id="msg"></div>`;
}
function openStation(id){view={name:'station',id};q='';render()}
function stationForm(id){
  const s=data.stations.find(x=>x.id===id)||{name:'',code:'',manager:'',place:''};
  dlg(`<h3 style="margin-top:0">${id?'Sửa':'Thêm'} trạm tổng kiểm tra</h3>
  <label>Tên trạm</label><input id="f_name" value="${esc(s.name)}"><label>Mã trạm</label><input id="f_code" value="${esc(s.code)}" placeholder="XVH102">
  <label>Nhân viên quản lý</label><input id="f_manager" value="${esc(s.manager)}"><label>Địa điểm</label><input id="f_place" value="${esc(s.place)}" placeholder="Ấp ..., Xã ..., Tỉnh/TP ...">
  <div class="row" style="margin-top:14px"><span class="sp"></span><button onclick="$('#dlg').close()">Hủy</button><button class="p" onclick="saveStation('${id||''}')">Lưu</button></div>`);
}
function saveStation(id){
  const v=k=>$('#f_'+k).value.trim();
  if(!v('code')){alert('Vui lòng nhập mã trạm');return}
  let s=data.stations.find(x=>x.id===id);
  if(!s){s={id:uid(),customers:[]};data.stations.push(s)}
  Object.assign(s,{name:v('name'),code:v('code').toUpperCase(),manager:v('manager'),place:v('place')});
  save();$('#dlg').close();render();
}
function delStation(id){const s=data.stations.find(x=>x.id===id);if(confirm(`Xóa trạm ${s.code} và toàn bộ ${s.customers.length} khách hàng?`)){data.stations=data.stations.filter(x=>x.id!==id);save();render()}}

/* Trang trạm: dựng khung một lần, sau đó chỉ cập nhật phần thay đổi (không vẽ lại cả trang, không dựng lại bản đồ) */
let stView=null,shown=100,qT;
function renderStation(){
  const s=station();$('#ttl').textContent='📍 Trạm '+s.code;
  destroyMap();stView=s.id;shown=100;
  $('#app').innerHTML=`<div class="card"><div class="row"><button onclick="view={name:'stations'};render()">← Các trạm</button><span class="sp"></span>
  <button class="p" onclick="custForm()">+ Thêm khách hàng</button><button onclick="$('#impf').click()">⬆ Nhập Excel/CSV</button><input type="file" id="impf" accept=".xlsx,.csv" hidden onchange="importFile(this)"><button class="p" onclick="exportXlsx()">⬇ Xuất Excel (mẫu A3)</button><button class="p" onclick="exportSheet()">☁ Xuất Google Sheet</button></div>
  <p class="mu" id="sthead" style="margin-bottom:0"></p><div id="msg"></div></div>
  <div class="card"><input id="qin" type="search" placeholder="Tìm theo tên, mã KH, SĐT…" value="${esc(q)}" oninput="onSearch(this.value)" enterkeyhint="search" autocomplete="off">
  <div class="tw" style="margin-top:10px"><table><thead><tr><th>Ký hiệu</th><th>Tên</th><th>Mã KH</th><th>SĐT</th><th>Cấp ống</th><th>X (Vĩ độ)</th><th>Y (Kinh độ)</th><th>Kiểm tra</th><th></th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="more"></div></div>
  <div class="card"><div class="row"><h3 style="margin:0" class="sp">Sơ đồ các điểm đã lưu</h3><span id="gmb"></span><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" ${mapLines?'checked':''} onchange="mapLines=this.checked;updateMap(false)"> Nối theo thứ tự &amp; hiện chiều dài</label></div>
  <div id="mapbox"></div><div id="ptinfo" class="mu" style="margin-top:6px">Bấm vào một điểm để xem chi tiết.</div><div id="segbox"></div></div><div id="secbox"></div>`;
  updateStation(true);
}
function updateStation(fit){
  const s=station();if(!s)return;
  $('#sthead').textContent=`${s.name||''} · NV quản lý: ${s.manager||''} · ${s.place||''}`;
  renderRows();
  $('#gmb').innerHTML=gmButtons(s);
  $('#segbox').innerHTML=segTable(s);
  $('#secbox').innerHTML=secCard(s);

function lenOf(s,chain){

function drawSvg(s){
  const P=s.customers.map((c,i)=>({c,i:i+1})).filter(p=>p.c.lat!=null&&p.c.lng!=null&&Math.abs(p.c.lat)<=90&&Math.abs(p.c.lng)<=180);
  if(!P.length)return '<p class="mu">Chưa có điểm nào có tọa độ để vẽ.</p>';
  const W=720,H=460,M=40,la=P.map(p=>p.c.lat),lo=P.map(p=>p.c.lng);
  let a=Math.min(...la),b=Math.max(...la),c0=Math.min(...lo),d=Math.max(...lo);
  const k=Math.cos((a+b)/2*Math.PI/180);
  let sw=(d-c0)*k,sh=b-a;if(sw<2e-4&&sh<2e-4){sw=sh=2e-4}
  const sc=Math.min((W-2*M)/(sw||1e-9),(H-2*M)/(sh||1e-9)),ox=(W-sw*sc)/2,oy=(H-sh*sc)/2;
  const X=g=>ox+(g-c0)*k*sc,Y=l=>oy+(b-l)*sc;
  let g='';for(let i=0;i<=4;i++){const x=M+i*(W-2*M)/4,y=M+i*(H-2*M)/4;g+=`<line x1="${x}" y1="${M}" x2="${x}" y2="${H-M}" stroke="var(--bd)"/><line x1="${M}" y1="${y}" x2="${W-M}" y2="${y}" stroke="var(--bd)"/>`}
  const mpp=111320/sc,nice=[10,20,50,100,200,500,1000,2000,5000,10000,20000,50000].find(n=>n/mpp>70)||50000;
  const bar=`<line x1="${M}" y1="${H-14}" x2="${M+nice/mpp}" y2="${H-14}" stroke="var(--tx)" stroke-width="3"/><text x="${M+nice/mpp+6}" y="${H-10}" font-size="12" fill="var(--tx)">${nice>=1000?nice/1000+' km':nice+' m'}</text>`;
  const line=mapLines&&P.length>1?`<polyline fill="none" stroke="var(--pr)" stroke-width="1.5" stroke-dasharray="5 4" points="${P.map(p=>X(p.c.lng)+','+Y(p.c.lat)).join(' ')}"/>`+segs(s).map(x=>{const A=P.find(p=>p.i===x.a).c,B=P.find(p=>p.i===x.b).c;return `<text x="${(X(A.lng)+X(B.lng))/2}" y="${(Y(A.lat)+Y(B.lat))/2-5}" text-anchor="middle" font-size="11" fill="var(--tx)" stroke="var(--bg)" stroke-width="3" paint-order="stroke">${fmtD(x.km)}</text>`}).join(''):'';
  const pts=P.map(p=>{const bad=issuesOf(s,p.c).length>0,x=X(p.c.lng),y=Y(p.c.lat);
    return `<g style="cursor:pointer" onclick="showPt('${p.c.id}',${p.i})"><circle cx="${x}" cy="${y}" r="11" fill="${bad?'var(--dg)':'var(--pr)'}" stroke="var(--card)" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">${p.i}</text><text x="${x+15}" y="${y+4}" font-size="11" font-weight="bold" fill="var(--tx)" stroke="var(--bg)" stroke-width="3" paint-order="stroke">${esc(ptLabel(p.i,p.c))}</text></g>`}).join('');
  const lab=`<text x="${M}" y="16" font-size="11" fill="var(--mu)">Bắc ↑ · X: ${b.toFixed(5)} (trên) – ${a.toFixed(5)} (dưới) · Y: ${c0.toFixed(5)} (trái) – ${d.toFixed(5)} (phải)</text>`;
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;background:var(--bg);border:1px solid var(--bd);border-radius:8px">${g}${lab}${line}${pts}${bar}</svg></div><div class="mu">${P.length}/${s.customers.length} điểm có tọa độ · chấm đỏ là điểm cần kiểm tra lại</div>`;
}

const num=x=>{const n=parseFloat(String(x??'').replace(',','.'));return isNaN(n)?null:n};
function hav(a,b,c,d){const R=6371,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function med(a){a=[...a].sort((x,y)=>x-y);return a[Math.floor(a.length/2)]}
function issues(lat,lng,s,selfId){
  const o=[];
  if(lat==null||lng==null)return ['Thiếu X hoặc Y'];
  if(Math.abs(lat)>90||Math.abs(lng)>180)return ['Ngoài phạm vi hợp lệ (X: -90…90, Y: -180…180)'];
  if(lat>=100&&lat<=112&&lng>=6&&lng<=24)o.push('Có thể bị đảo X và Y (vĩ độ phải khoảng 8–24 ở Việt Nam)');
  else if(lat<8||lat>24||lng<102||lng>110)o.push('Nằm ngoài lãnh thổ Việt Nam');
  const ot=s.customers.filter(c=>c.id!==selfId&&c.lat!=null&&c.lng!=null);
  if(ot.length>=2){const d=hav(lat,lng,med(ot.map(c=>c.lat)),med(ot.map(c=>c.lng)));if(d>20)o.push('Cách tâm các điểm khác của trạm khoảng '+d.toFixed(0)+' km')}
  const near=ot.find(c=>hav(lat,lng,c.lat,c.lng)<0.003);
  if(near)o.push('Trùng vị trí với “'+near.name+'”');
  return o;
}
/* Kiểm tra tọa độ cho cả danh sách: tính một lần cho mỗi lần dữ liệu thay đổi (trước đây mỗi dòng duyệt lại toàn bộ danh sách) */
let ic={v:-1,id:null,m:null};
function issuesOf(s,c){
  if(ic.v!==dataVer||ic.id!==s.id)ic={v:dataVer,id:s.id,m:buildIssues(s)};
  return ic.m.get(c.id)||[];
}
function buildIssues(s){
  const m=new Map(),all=s.customers.filter(c=>c.lat!=null&&c.lng!=null);
  const mla=all.length>=3?med(all.map(c=>c.lat)):null,mlo=all.length>=3?med(all.map(c=>c.lng)):null;
  const CS=0.0001,grid=new Map(),key=(a,b)=>a+','+b;
  all.forEach(c=>{const k=key(Math.round(c.lat/CS),Math.round(c.lng/CS));(grid.get(k)||grid.set(k,[]).get(k)).push(c)});
  s.customers.forEach(c=>{
    const o=[],lat=c.lat,lng=c.lng;
    if(lat==null||lng==null){m.set(c.id,['Thiếu X hoặc Y']);return}
    if(Math.abs(lat)>90||Math.abs(lng)>180){m.set(c.id,['Ngoài phạm vi hợp lệ (X: -90…90, Y: -180…180)']);return}
    if(lat>=100&&lat<=112&&lng>=6&&lng<=24)o.push('Có thể bị đảo X và Y (vĩ độ phải khoảng 8–24 ở Việt Nam)');
    else if(lat<8||lat>24||lng<102||lng>110)o.push('Nằm ngoài lãnh thổ Việt Nam');
    if(mla!=null){const d=hav(lat,lng,mla,mlo);if(d>20)o.push('Cách tâm các điểm khác của trạm khoảng '+d.toFixed(0)+' km')}
    const a=Math.round(lat/CS),b=Math.round(lng/CS);let near=null;
    for(let i=-1;i<=1&&!near;i++)for(let j=-1;j<=1&&!near;j++){const g=grid.get(key(a+i,b+j));if(g)near=g.find(x=>x.id!==c.id&&hav(lat,lng,x.lat,x.lng)<0.003)||null}
    if(near)o.push('Trùng vị trí với “'+near.name+'”');
    m.set(c.id,o);
  });
  return m;
}

const nz=t=>String(t??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const cv=c=>{let v=c.value;if(v&&typeof v==='object'){if('result' in v)v=v.result;else if(v.richText)v=v.richText.map(t=>t.text).join('');else if(v.text)v=v.text;else if(v instanceof Date)v=v.toISOString()}return v==null?'':v};
function mapCols(grid){
  const m={};let hr=-1;
  for(let r=0;r<Math.min(grid.length,15);r++)(grid[r]||[]).forEach((v,c)=>{
    const t=nz(v);if(!t)return;let k=null;
    if(t==='x'||t.includes('vi do')||/^(lat|latitude)\b/.test(t))k='lat';
    else if(t==='y'||t.includes('kinh do')||/^(lon|lng|longitude)\b/.test(t))k='lng';
    else if(/\bten (tai diem|khach|kh)\b/.test(t)||t==='ten'||t==='name'||t==='ten diem')k='name';
    else if(/^ma (kh|khach)/.test(t)||t==='code')k='code';
    else if(/sdt|dien thoai|phone/.test(t))k='phone';
    else if(t.includes('cap ong'))k='pipe';
    else if(t.includes('toa do'))k='both';
    if(k&&!(k in m)){m[k]=c;hr=Math.max(hr,r)}
  });
  return {m,hr};
}
function extractRows(grid,mc){
  const {m,hr}=mc,rows=[];
  for(let r=hr+1;r<grid.length;r++){
    const row=grid[r]||[],g=k=>m[k]==null?'':String(row[m[k]]??'').trim();
    let lat=null,lng=null;
    if(m.lat!=null&&m.lng!=null){lat=num(row[m.lat]);lng=num(row[m.lng])}
    else if(m.both!=null){const x=String(row[m.both]??'').match(/(-?\d+[.,]\d+)\D+(-?\d+[.,]\d+)/);if(x){lat=num(x[1]);lng=num(x[2])}}
    let phone=g('phone');if(/^\d{9}$/.test(phone))phone='0'+phone;
    const name=g('name'),code=g('code');
    if(lat==null&&lng==null&&!name&&!code&&!phone)continue;
    rows.push({name,code,phone,pipe:g('pipe'),lat,lng});
  }
  return rows;
}
function parseCsv(t){
  t=t.replace(/^\ufeff/,'');const first=t.split(/\r?\n/)[0]||'';
  const d=[['\t',(first.match(/\t/g)||[]).length],[';',(first.match(/;/g)||[]).length],[',',(first.match(/,/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
  const out=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);out.push(row);row=[];cur=''}
    else cur+=ch}
  if(cur!==''||row.length){row.push(cur);out.push(row)}
  return out;
}
let pendingImp=[];
async function importFile(inp){
  const f=inp.files[0];inp.value='';const m=$('#msg');if(!f)return;
  m.className='mu';m.textContent='Đang đọc file…';
  try{
    const grids=[];
    if(/\.csv$/i.test(f.name))grids.push(parseCsv(await f.text()));
    else if(/\.xlsx$/i.test(f.name)){
      await lib('excel').catch(()=>{throw new Error('Chưa tải được thư viện Excel. Kiểm tra mạng rồi thử lại.')});
      const wb=new ExcelJS.Workbook();await wb.xlsx.load(await f.arrayBuffer());
      wb.worksheets.forEach(ws=>{const g=[];for(let r=1;r<=ws.rowCount;r++){const a=[];for(let c=1;c<=ws.columnCount;c++)a.push(cv(ws.getCell(r,c)));g.push(a)}grids.push(g)});
    }else throw new Error('Chỉ nhận file .xlsx hoặc .csv (file .xls cũ hãy lưu lại thành .xlsx).');
    let grid=null,mc=null;
    for(const g of grids){const x=mapCols(g);if((x.m.lat!=null&&x.m.lng!=null)||x.m.both!=null){grid=g;mc=x;break}}
    if(!grid)throw new Error('Không tìm thấy cột tọa độ. Hàng tiêu đề cần có cột “X” (hoặc “Vĩ độ”) và “Y” (hoặc “Kinh độ”).');
    pendingImp=extractRows(grid,mc);
    if(!pendingImp.length)throw new Error('Không có dòng dữ liệu nào bên dưới hàng tiêu đề.');
    const s=station(),nc=pendingImp.filter(r=>r.lat==null||r.lng==null).length;
    const pv=pendingImp.slice(0,5).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.code)}</td><td>${r.lat??''}</td><td>${r.lng??''}</td></tr>`).join('');
    m.textContent='';
    dlg(`<h3 style="margin-top:0">Nhập từ “${esc(f.name)}”</h3>
    <p>Đọc được <b>${pendingImp.length}</b> điểm${nc?`, trong đó <span class="err">${nc} điểm thiếu tọa độ</span>`:''}.</p>
    <div class="tw"><table><tr><th>Tên</th><th>Mã KH</th><th>X</th><th>Y</th></tr>${pv}</table></div>
    <p class="mu">${pendingImp.length>5?'Hiển thị 5 điểm đầu. ':''}Trạm đang có ${s.customers.length} điểm.${s.customers.length?' “Thay thế” sẽ xóa các điểm cũ và đánh lại ký hiệu từ 1 (các đoạn điểm nút đã nhập cần kiểm tra lại).':''}</p>
    <div class="row" style="margin-top:14px"><span class="sp"></span><button onclick="$('#dlg').close()">Hủy</button>${s.customers.length?'<button class="d" onclick="applyImport(\'replace\')">Thay thế tất cả</button>':''}<button class="p" onclick="applyImport(\'add\')">${s.customers.length?'Thêm vào cuối':'Nhập'}</button></div>`);
  }catch(e){m.className='err';m.textContent=e.message||String(e)}
}
function applyImport(mode){

  ['Stt','Đoạn điểm nút','Cấp ống (mm)','Chiều dài (m)','Số lượng\n khách hàng','Vị trí điểm thay đổi cấp ống','Loại thay đổi \ncấp ống','Ghi chú'].forEach((h,j)=>{const x=w2.getCell(5,j+1);x.value=h;x.font=T11(true);x.alignment=ctr;x.border=bd});
  w2.getRow(5).height=28.5;
  const secs=s.sections||[],nn=v=>v===''||v==null?null:(isNaN(Number(v))?v:Number(v));
  secs.forEach((x,i)=>{
    const r=6+i,pr=parseChanges(x.changes);
    [i+1,x.chain,nn(x.pipe),nn(x.len),nn(x.cust),pr.pts.join('\n')||null,pr.types.join('\n')||null,x.note||null].forEach((v,j)=>{
      const c=w2.getCell(r,j+1);c.value=v===''?null:v;c.font=T11();c.alignment=ctr;c.border=bd;if(j===1)c.numFmt='@'});
    w2.getRow(r).height=Math.max(15,15*Math.max(pr.pts.length,pr.types.length,1));
  });
  const tr=6+Math.max(secs.length,1),pipes=new Set(secs.map(x=>String(x.pipe||'').trim()).filter(Boolean));
  for(let c=1;c<=8;c++){const x=w2.getCell(tr,c);x.border=bd;x.font=T11(true);x.alignment=ctr}
  w2.getCell(tr,1).value='Tổng';w2.getCell(tr,3).value=String(pipes.size).padStart(2,'0')+' CẤP ỐNG';
  const sum=k2=>secs.reduce((a,x)=>a+(Number(x[k2])||0),0);
  if(secs.length){w2.getCell(tr,4).value={formula:`SUM(D6:D${tr-1})`,result:sum('len')};w2.getCell(tr,5).value={formula:`SUM(E6:E${tr-1})`,result:sum('cust')}}
  [['Cần Thơ, ngày......tháng......năm........',false,true],['NGƯỜI THỰC HIỆN',true,false],['(Ký, ghi rõ họ tên)',false,true]].forEach(([txt,b2,it],k2)=>{
    w2.mergeCells(tr+1+k2,6,tr+1+k2,8);const x=w2.getCell(tr+1+k2,6);x.value=txt;x.font=T11(b2,it);x.alignment={horizontal:'center',vertical:'middle'}});
  try{
    const buf=await wb.xlsx.writeBuffer(),fn=`PHU_LUC_A3_${s.code}.xlsx`;
    const dl=await (window.claude?.use?.('downloads')||null);
    if(dl){await dl.save({filename:fn,data:buf})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf]));a.download=fn;a.click()}
    m.className='ok';m.textContent='Đã tạo file '+fn;
  }catch(e){m.className='err';m.textContent=e&&e.code==='declined'?'Bạn đã hủy lưu file.':'Không xuất được file: '+(e.message||e)}
}

/* ===== KHỞI ĐỘNG: hiện giao diện ngay từ dữ liệu trên máy, đồng bộ ở nền ===== */
let swReg=null;
if('serviceWorker' in navigator){
  let had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!had){had=true;return}
    if(!isDirty()&&!$('#dlg').open)location.reload();
    else toast('Có bản cập nhật mới, hãy mở lại ứng dụng.');
  });
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data&&e.data.type==='updated')toast('Có bản cập nhật mới.',{label:'Tải lại',js:'location.reload()'});
  });
  navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
}
(function boot(){
  if(user&&token){
    let c=null;try{c=JSON.parse(st.get(localKey())||'null')}catch(e){}
    loaded=!!(c&&c.stations);data=loaded?c:{stations:[]};dataVer++;
    render();sync();prewarm();
  }else{user=null;render();prewarm()}
})();
/* Quay lại app / có mạng lại / dữ liệu chờ gửi -> tự đồng bộ */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    if(user&&Date.now()-lastSync>30000)sync();
    if(swReg)swReg.update().catch(()=>{});
  }else if(isDirty())push();
});
addEventListener('online',()=>sync());
setInterval(()=>{if(document.visibilityState==='visible'&&user&&!syncing&&(isDirty()||Date.now()-lastSync>120000))sync()},30000);
/* Kéo màn hình xuống để làm mới (không áp dụng trên bản đồ và hộp thoại) */
(function(){
  const el=$('#ptr');let y0=0,on=false,d=0;
  const skip=t=>t.closest&&t.closest('#lmap,dialog');
  const hide=()=>{el.style.transform='translate(-50%,-150%)';el.style.opacity=0};
  addEventListener('touchstart',e=>{on=false;if(!user||scrollY>0||e.touches.length!==1||skip(e.target))return;y0=e.touches[0].clientY;on=true;d=0},{passive:true});
  addEventListener('touchmove',e=>{
    if(!on)return;d=e.touches[0].clientY-y0;
    if(d<=10||scrollY>0){hide();return}
    el.textContent=d>140?'↑ Thả để làm mới':'↓ Kéo để làm mới';
    el.style.opacity=1;el.style.transform=`translate(-50%,${Math.min(d/3,50)}px)`;
  },{passive:true});
  addEventListener('touchend',()=>{if(!on)return;on=false;hide();if(d>140)sync(true)});
  addEventListener('touchcancel',()=>{on=false;hide()});
})();
</script>
